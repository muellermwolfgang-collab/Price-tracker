name: Black Week Prices

on:
  schedule:
    # 06:15 and 17:15 UTC = 07:15 and 18:15 Berlin (winter time, CET), so the
    # results are in the repo before 07:40 / 18:40 Berlin time.
    # GitHub starts scheduled runs late or drops them now and then, so there is
    # a backup start 12 minutes later; it ends right away (job "check") when the
    # results on the branch are already fresh.
    - cron: "15,27 6 * * *"
    - cron: "15,27 17 * * *"
  workflow_dispatch: {}   # manual run from the Actions tab / GitHub app

permissions:
  contents: write         # commit black_week/results/ and urls.json back to the repo

concurrency:
  group: black-week
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.fresh.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      # scheduled runs only: skip if the last results are younger than 40 min
      # (fetch the branch tip - the checkout is the commit at trigger time)
      - name: Results already fresh?
        id: fresh
        run: |
          git fetch -q --depth=1 origin "${GITHUB_REF_NAME}"
          git show FETCH_HEAD:black_week/results/latest.json > /tmp/latest.json 2>/dev/null || echo '{}' > /tmp/latest.json
          python3 -c '
          import json, os
          from datetime import datetime, timezone
          skip = "false"
          if os.environ["GITHUB_EVENT_NAME"] == "schedule":
              try:
                  gen = json.load(open("/tmp/latest.json"))["generated_at"]
                  age = datetime.now(timezone.utc) - datetime.fromisoformat(gen.replace("Z", "+00:00"))
                  if age.total_seconds() < 40 * 60:
                      skip = "true"
                      print(f"results are {age.total_seconds() / 60:.0f} min old - nothing to do")
              except Exception as exc:
                  print(f"no usable results ({exc}) - running")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"skip={skip}\n")
          '

  fetch:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # the branch tip at job start, not the commit at trigger time: runs wait
      # for each other (concurrency group) and must see the previous run's commit
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: black_week/requirements.txt

      - name: Install Python dependencies (Playwright version pinned)
        run: pip install -r black_week/requirements.txt

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # requirements.txt pins the Playwright version, so its hash changes
          # whenever the matching Chromium build changes.
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('black_week/requirements.txt') }}

      - name: Install Playwright browser (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright system libraries (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      # Errors on single URLs are recorded as a status in the results and never
      # fail this step. It exits non-zero only if no result file could be written.
      - name: Fetch prices
        run: python -u black_week/run.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add black_week/results/
          # URLs found automatically for moved/missing products
          if [ -f black_week/urls.json ]; then git add black_week/urls.json; fi
          if git diff --cached --quiet; then
            echo "No changes - nothing to commit."
            exit 0
          fi
          git commit -m "black_week: results $(date -u +%Y-%m-%dT%H:%MZ)"
          # other workflows commit to the same branch: rebase onto them before pushing
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git rebase --abort 2>/dev/null || true      # a failed rebase must not block the next try
            sleep $((i * 5))
          done
          echo "push failed" >&2
          exit 1
