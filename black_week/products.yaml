# Products to watch (see readme.md, section "black_week").
#
# The scout (workflow "Black Week Scout", daily) searches every shop in
# shops.yaml for each product and adds verified offers to targets.yaml.
#
# Fields:
#   product    name as a shop would write it - brand and model words matter
#   keywords   optional: words the shop page must contain, e.g. ["2.000 W"]
#   active     false = no more searching (existing targets stay)
#
# Adding a product: ask Claude in a chat with GitHub access ("Black Week:
# füge <Produkt> hinzu"), start the workflow "Black Week Scout" with the
# field "product" in the GitHub app, or add an entry here.

